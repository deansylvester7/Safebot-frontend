name: safebot_app
description: "T&T Safety Assistant"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  shared_preferences: ^2.5.3

  cupertino_icons: ^1.0.8

  # Backend API communication
  http: ^1.2.2

  # Open external links / manual sources
  url_launcher: ^6.3.2

  # PDF viewer for web, Android, and iOS
  syncfusion_flutter_pdfviewer: ^28.2.12

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png